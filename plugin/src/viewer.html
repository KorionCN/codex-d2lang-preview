<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D2 Preview</title>
<style>
:root{color-scheme:light dark;--bg:#f8fafc;--fg:#172033;--line:#d9e0e9;--muted:#58657a;--error:#a82026}
@media(prefers-color-scheme:dark){:root{--bg:#131820;--fg:#e5eaf2;--line:#343e4d;--muted:#acb8c9;--error:#ff9c9c}}
:root[data-theme=dark]{--bg:#131820;--fg:#e5eaf2;--line:#343e4d;--muted:#acb8c9;--error:#ff9c9c}
:root[data-theme=light]{--bg:#f8fafc;--fg:#172033;--line:#d9e0e9;--muted:#58657a;--error:#a82026}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px system-ui,sans-serif}main{height:100vh;min-height:360px;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}strong{margin-right:auto;overflow:hidden;text-overflow:ellipsis;max-width:45vw}button,select{color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:hover{filter:brightness(.9)}#stage{overflow:auto;overscroll-behavior:contain;min-height:0;min-width:0;flex:1;display:grid;place-items:safe center;padding:20px;position:relative}#diagram{display:none;max-width:none}#status{padding:8px 12px;color:var(--muted);border-top:1px solid var(--line);font-size:12px}#error{display:none;white-space:pre-wrap;word-break:break-word;color:var(--error);padding:16px;margin:0;border-bottom:1px solid var(--line);max-height:200px;overflow:auto}#placeholder{color:var(--muted)}
</style></head><body><main><header><strong id="filename">D2 Preview</strong><select id="layout" aria-label="布局"><option value="elk">ELK</option><option value="dagre">Dagre</option></select><button id="minus" aria-label="缩小">−</button><button id="fit">适应窗口</button><button id="plus" aria-label="放大">＋</button><button id="refresh">刷新</button><button id="export" disabled>导出 PNG</button></header><pre id="error" role="alert"></pre><div id="stage" title="滚轮向上放大，向下缩小"><span id="placeholder">等待打开 .d2 文件…</span><img id="diagram" alt="D2 图表预览"></div><div id="status" role="status">连接 Codex 文件预览器…</div></main><script>/*APP_SCRIPT*/</script></body></html>
